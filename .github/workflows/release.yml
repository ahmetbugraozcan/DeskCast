name: Release (Developer ID)

# On a push/merge to the `release` branch, build DeskCast with a Developer ID
# certificate, notarize + staple it, package a signed & notarized .dmg, and
# publish it to GitHub Releases (for distribution from your own site).
on:
  push:
    branches: [release]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: developer-id-release
  cancel-in-progress: false

jobs:
  build-notarize-release:
    runs-on: macos-latest
    env:
      PROJECT: screenshotapp.xcodeproj
      SCHEME: screenshotapp
      APP_NAME: DeskCast
      ARCHIVE_PATH: ${{ github.workspace }}/build/DeskCast.xcarchive
      EXPORT_PATH: ${{ github.workspace }}/build/export
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Import Developer ID certificate
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          CERT_PATH="$RUNNER_TEMP/certificate.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"

          echo "$BUILD_CERTIFICATE_BASE64" | base64 --decode > "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain

      - name: Set up App Store Connect API key (for notarytool)
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ASC_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.private_keys"
          echo "$ASC_KEY_BASE64" | base64 --decode > "$HOME/.private_keys/AuthKey_${ASC_KEY_ID}.p8"

      - name: Archive
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          KEY_PATH="$HOME/.private_keys/AuthKey_${ASC_KEY_ID}.p8"
          xcodebuild clean archive \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -archivePath "$ARCHIVE_PATH" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}"

      - name: Export (Developer ID)
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          KEY_PATH="$HOME/.private_keys/AuthKey_${ASC_KEY_ID}.p8"
          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportOptionsPlist ci/ExportOptions.plist \
            -exportPath "$EXPORT_PATH" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Notarize and staple the app
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          KEY_PATH="$HOME/.private_keys/AuthKey_${ASC_KEY_ID}.p8"
          APP="$EXPORT_PATH/$APP_NAME.app"
          ZIP="$RUNNER_TEMP/$APP_NAME.zip"
          ditto -c -k --keepParent "$APP" "$ZIP"
          xcrun notarytool submit "$ZIP" \
            --key "$KEY_PATH" \
            --key-id "$ASC_KEY_ID" \
            --issuer "$ASC_ISSUER_ID" \
            --wait
          xcrun stapler staple "$APP"

      - name: Package signed .dmg
        run: |
          set -euo pipefail
          APP="$EXPORT_PATH/$APP_NAME.app"
          mkdir -p "$GITHUB_WORKSPACE/dist"
          DMG="$GITHUB_WORKSPACE/dist/$APP_NAME.dmg"
          rm -f "$DMG"
          # Build a designed drag-to-install .dmg (branded background + arrow).
          # appdmg resolves paths in appdmg.json relative to its own folder, so
          # stage the notarized app next to the spec.
          rm -rf "ci/dmg/$APP_NAME.app"
          cp -R "$APP" "ci/dmg/$APP_NAME.app"
          npx --yes appdmg ci/dmg/appdmg.json "$DMG"
          rm -rf "ci/dmg/$APP_NAME.app"
          codesign --force --sign "Developer ID Application" --timestamp "$DMG"

      - name: Notarize and staple the .dmg
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          KEY_PATH="$HOME/.private_keys/AuthKey_${ASC_KEY_ID}.p8"
          DMG="$GITHUB_WORKSPACE/dist/$APP_NAME.dmg"
          xcrun notarytool submit "$DMG" \
            --key "$KEY_PATH" \
            --key-id "$ASC_KEY_ID" \
            --issuer "$ASC_ISSUER_ID" \
            --wait
          xcrun stapler staple "$DMG"

      - name: Read app version
        id: meta
        run: |
          set -euo pipefail
          APP="$EXPORT_PATH/$APP_NAME.app"
          VERSION=$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" "$APP/Contents/Info.plist")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Package and sign Sparkle update
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          APP="$EXPORT_PATH/$APP_NAME.app"
          UPDATE_DIR="$GITHUB_WORKSPACE/dist/update"
          RELEASE_TAG="v${{ steps.meta.outputs.version }}-${{ github.run_number }}"
          mkdir -p "$UPDATE_DIR"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "$UPDATE_DIR/$APP_NAME.zip"

          GENERATE_APPCAST=$(find "$HOME/Library/Developer/Xcode/DerivedData" \
            -path '*/SourcePackages/artifacts/sparkle/Sparkle/bin/generate_appcast' \
            -type f -print -quit)
          test -n "$GENERATE_APPCAST"
          printf '%s' "$SPARKLE_PRIVATE_KEY" | "$GENERATE_APPCAST" \
            --ed-key-file - \
            --download-url-prefix "https://github.com/${{ github.repository }}/releases/download/$RELEASE_TAG/" \
            --link "https://github.com/${{ github.repository }}/releases/latest" \
            -o "$GITHUB_WORKSPACE/dist/appcast.xml" \
            "$UPDATE_DIR"

          mv "$UPDATE_DIR/$APP_NAME.zip" "$GITHUB_WORKSPACE/dist/$APP_NAME.zip"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.meta.outputs.version }}-${{ github.run_number }}
          name: DeskCast ${{ steps.meta.outputs.version }} (build ${{ github.run_number }})
          files: |
            dist/DeskCast.dmg
            dist/DeskCast.zip
            dist/appcast.xml
          prerelease: false
          generate_release_notes: true
